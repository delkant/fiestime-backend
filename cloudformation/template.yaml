AWSTemplateFormatVersion: '2010-09-09'
Description: >
  fiestime video upload backend (Phase 1) - S3 bucket + Lambda GraphQL API (serverless).

Parameters:
  UploadBucketName:
    Type: String
    Description: Name of the S3 bucket that will store uploaded videos.
  LambdaFunctionName:
    Type: String
    Default: fiestime-graphql
    Description: Logical name for the GraphQL Lambda function.
  LambdaMemorySize:
    Type: Number
    Default: 512
    Description: Memory size (MB) for the Lambda function.
  LambdaTimeout:
    Type: Number
    Default: 30
    Description: Timeout (seconds) for the Lambda function.
  ApiStageName:
    Type: String
    Default: v1
    Description: API Gateway HTTP API stage name.
  CodeS3Bucket:
    Type: String
    Description: S3 bucket that stores the built Lambda artifact (zip).
  CodeS3Key:
    Type: String
    Description: S3 key of the built Lambda artifact (zip) for this deployment.

Resources:
  # Note: S3 buckets are created externally and referenced by name

  GraphqlLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FiestimeS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${UploadBucketName}
                  - !Sub arn:aws:s3:::${UploadBucketName}/*

  GraphqlLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: nodejs20.x
      Handler: index.graphqlHandler
      Role: !GetAtt GraphqlLambdaRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucketName
          PRESIGNED_URL_TTL_SECONDS: 900

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      ProtocolType: HTTP
      Name: fiestime-http-api

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GraphqlLambda.Arn}/invocations
      PayloadFormatVersion: '2.0'

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /graphql
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref ApiStageName
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GraphqlLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/graphql

Outputs:
  UploadBucketName:
    Description: S3 bucket name for uploaded videos
    Value: !Ref UploadBucketName
  HttpApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/graphql
