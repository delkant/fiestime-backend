name: Deploy Sandbox stack

on:
  push:
    branches:
      - sandbox

jobs:
  build-and-deploy-sandbox:
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda artifact
        run: |
          zip -r build-artifact.zip dist node_modules package.json

      - name: Debug GitHub secrets
        run: |
          echo "Checking if secrets are available..."
          echo "AWS_ACCESS_KEY_ID_SANDBOX: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX != '' }}"
          echo "AWS_SECRET_ACCESS_KEY_SANDBOX: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX != '' }}"
          echo "AWS_REGION_SANDBOX: ${{ secrets.AWS_REGION_SANDBOX != '' }}"
          echo "CODE_BUCKET_SANDBOX: ${{ secrets.CODE_BUCKET_SANDBOX != '' }}"
          echo "UPLOAD_BUCKET_SANDBOX: ${{ secrets.UPLOAD_BUCKET_SANDBOX != '' }}"
          echo "CLOUDFORMATION_STACK_NAME_SANDBOX: ${{ secrets.CLOUDFORMATION_STACK_NAME_SANDBOX != '' }}"

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}" ]; then
            echo "❌ AWS_ACCESS_KEY_ID_SANDBOX is not set"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY_SANDBOX is not set"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_REGION_SANDBOX }}" ]; then
            echo "❌ AWS_REGION_SANDBOX is not set"
            exit 1
          fi
          echo "✅ All required AWS secrets are configured"

      - name: Configure AWS credentials (Sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws-region: ${{ secrets.AWS_REGION_SANDBOX }}

      - name: Verify AWS configuration
        run: |
          echo "Testing AWS CLI configuration..."
          aws sts get-caller-identity
          echo "✅ AWS credentials are working"

      - name: Create code bucket if needed (upload bucket created by CloudFormation)
        run: |
          echo "Creating code bucket if it doesn't exist..."
          echo "Code bucket: ${{ secrets.CODE_BUCKET_SANDBOX }}"
          echo "Region: ${{ secrets.AWS_REGION_SANDBOX }}"

          # Create code bucket (CloudFormation will create upload bucket)
          if aws s3 ls s3://${{ secrets.CODE_BUCKET_SANDBOX }} 2>/dev/null; then
            echo "✅ Code bucket already exists"
          else
            echo "Creating code bucket..."
            aws s3 mb s3://${{ secrets.CODE_BUCKET_SANDBOX }} --region ${{ secrets.AWS_REGION_SANDBOX }}
            echo "✅ Code bucket created"
          fi

          echo "Note: Upload bucket will be created by CloudFormation"

      - name: Upload artifact to S3 (Sandbox)
        run: |
          export CODE_S3_KEY="fiestime/backend/sandbox/build-artifact-${{ github.sha }}.zip"
          echo "Uploading build artifact to S3..."
          aws s3 cp build-artifact.zip "s3://${{ secrets.CODE_BUCKET_SANDBOX }}/${CODE_S3_KEY}"
          echo "✅ Upload completed. Verifying object exists..."
          aws s3 ls "s3://${{ secrets.CODE_BUCKET_SANDBOX }}/${CODE_S3_KEY}"
          echo "✅ Build artifact verified in S3"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_SANDBOX }}

      - name: Deploy CloudFormation stack (Sandbox)
        run: |
          export CODE_S3_KEY="fiestime/backend/sandbox/build-artifact-${{ github.sha }}.zip"
          echo "Deploying CloudFormation stack with parameters:"
          echo "  Stack Name: ${{ secrets.CLOUDFORMATION_STACK_NAME_SANDBOX }}"
          echo "  Upload Bucket: ${{ secrets.UPLOAD_BUCKET_SANDBOX }}"
          echo "  Code Bucket: ${{ secrets.CODE_BUCKET_SANDBOX }}"
          echo "  Code S3 Key: ${CODE_S3_KEY}"
          echo "  Region: ${{ secrets.AWS_REGION_SANDBOX }}"

          # Double-check that the S3 object exists before deployment
          aws s3 ls "s3://${{ secrets.CODE_BUCKET_SANDBOX }}/${CODE_S3_KEY}" || {
            echo "❌ Error: Build artifact not found in S3"
            exit 1
          }

          # Test CloudFormation service's access to the S3 bucket
          echo "🔍 Testing S3 bucket access for CloudFormation..."
          aws s3api head-bucket --bucket "${{ secrets.CODE_BUCKET_SANDBOX }}" --region "${{ secrets.AWS_REGION_SANDBOX }}" || {
            echo "⚠️ Warning: Cannot access S3 bucket or bucket in different region"
          }

          # Get bucket location
          BUCKET_REGION=$(aws s3api get-bucket-location --bucket "${{ secrets.CODE_BUCKET_SANDBOX }}" --query 'LocationConstraint' --output text)
          echo "📍 Code bucket region: ${BUCKET_REGION}"
          echo "📍 Deployment region: ${{ secrets.AWS_REGION_SANDBOX }}"
          if [ "${BUCKET_REGION}" != "${{ secrets.AWS_REGION_SANDBOX }}" ] && [ "${BUCKET_REGION}" != "null" ]; then
            echo "⚠️ WARNING: S3 bucket is in ${BUCKET_REGION} but deploying to ${{ secrets.AWS_REGION_SANDBOX }}"
          fi

          # Try manual changeset creation for better error diagnostics
          CHANGESET_NAME="deploy-$(date +%s)"
          echo "Creating changeset: ${CHANGESET_NAME}"

          aws cloudformation create-change-set \
            --template-body file://cloudformation/template.yaml \
            --stack-name "${{ secrets.CLOUDFORMATION_STACK_NAME_SANDBOX }}" \
            --change-set-name "${CHANGESET_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=UploadBucketName,ParameterValue="${{ secrets.UPLOAD_BUCKET_SANDBOX }}" \
              ParameterKey=CodeS3Bucket,ParameterValue="${{ secrets.CODE_BUCKET_SANDBOX }}" \
              ParameterKey=CodeS3Key,ParameterValue="${CODE_S3_KEY}" \
              ParameterKey=LambdaFunctionName,ParameterValue="fiestime-graphql-sandbox" \
              ParameterKey=ApiStageName,ParameterValue="sandbox" \
            --region "${{ secrets.AWS_REGION_SANDBOX }}" || {
              echo "❌ Changeset creation failed. Getting detailed error information..."
              aws cloudformation describe-stack-events \
                --stack-name "${{ secrets.CLOUDFORMATION_STACK_NAME_SANDBOX }}" \
                --region "${{ secrets.AWS_REGION_SANDBOX }}" \
                --max-items 5 || echo "No stack events available"
              exit 1
          }

          echo "✅ Changeset created successfully. Executing changeset..."
          aws cloudformation execute-change-set \
            --change-set-name "${CHANGESET_NAME}" \
            --stack-name "${{ secrets.CLOUDFORMATION_STACK_NAME_SANDBOX }}" \
            --region "${{ secrets.AWS_REGION_SANDBOX }}"

          echo "⏳ Waiting for stack update to complete..."
          aws cloudformation wait stack-update-complete \
            --stack-name "${{ secrets.CLOUDFORMATION_STACK_NAME_SANDBOX }}" \
            --region "${{ secrets.AWS_REGION_SANDBOX }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_SANDBOX }}
