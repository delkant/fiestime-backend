name: Deploy QA stack

on:
  push:
    branches:
      - qa

jobs:
  build-and-deploy-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda artifact
        run: |
          zip -r build-artifact.zip dist node_modules package.json

      - name: Configure AWS credentials (QA)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-region: ${{ secrets.AWS_REGION_QA }}

      - name: Upload artifact to S3 (QA)
        run: |
          export CODE_S3_KEY="fiestime/backend/qa/build-artifact-${{ github.sha }}.zip"
          aws s3 cp build-artifact.zip "s3://${{ secrets.CODE_BUCKET_QA }}/${CODE_S3_KEY}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_QA }}

      - name: Deploy CloudFormation stack (QA)
        run: |
          export CODE_S3_KEY="fiestime/backend/qa/build-artifact-${{ github.sha }}.zip"
          aws cloudformation deploy \
            --template-file cloudformation/template.yaml \
            --stack-name "${{ secrets.CLOUDFORMATION_STACK_NAME_QA }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              UploadBucketName="${{ secrets.UPLOAD_BUCKET_QA }}" \
              CodeS3Bucket="${{ secrets.CODE_BUCKET_QA }}" \
              CodeS3Key="${CODE_S3_KEY}" \
              LambdaFunctionName="fiestime-graphql-qa" \
              ApiStageName="qa"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_QA }}
